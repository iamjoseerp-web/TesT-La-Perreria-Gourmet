<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Perrería Gourmet PV - V10.8</title>
    <style>
        :root { --gold: #D4AF37; --bg: #000; --card: #111; --text: #eee; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; padding-bottom: 80px; }
        .header { text-align: center; border-bottom: 2px solid var(--gold); padding-bottom: 10px; margin-bottom: 15px; }
        .logo-img { max-height: 80px; margin-bottom: 5px; }
        
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: var(--card); padding: 15px; border-radius: 8px; border-left: 4px solid var(--gold); text-align: center; }
        .stat-val { display: block; font-size: 20px; font-weight: bold; color: var(--gold); }
        .stat-label { font-size: 10px; text-transform: uppercase; color: #888; }

        .btn { border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .btn-gold { background: var(--gold); color: #000; }
        .btn-wa-action { background: #25D366; color: #fff; width: 100%; margin-top: 10px; }
        .btn-sm { padding: 5px 10px; font-size: 11px; }
        
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #333; z-index: 100; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
        .sheet { background: #181818; width: 90%; max-width: 450px; margin: 20px auto; padding: 20px; border-radius: 12px; border: 1px solid var(--gold); }
        
        label { display: block; font-size: 11px; color: var(--gold); margin: 10px 0 3px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
        th { text-align: left; color: var(--gold); padding: 8px; border-bottom: 1px solid #333; }
        td { padding: 10px 8px; border-bottom: 1px solid #222; }
        
        .status-pending { color: #f39c12; font-weight: bold; }
        .status-paid { color: #2ecc71; font-weight: bold; }
        .receipt-preview { background: #fff; color: #000; padding: 15px; margin-top: 15px; font-family: monospace; border-radius: 4px; font-size: 12px; white-space: pre-wrap; }
        .btn-grp { display: flex; gap: 5px; }
    </style>
</head>
<body>

<div class="header">
    <div id="logoContainer"></div>
    <h1 style="margin:0; font-size: 18px; color: var(--gold);">LA PERRERÍA GOURMET</h1>
    <p style="margin:0; font-size: 10px; color: #666;">V10.8 • INVENTORY & ROLODEX</p>
</div>

<div class="stat-grid">
    <div class="stat-card"><span class="stat-val" id="stockMain">0 kg</span><span class="stat-label">Chicken Stock</span></div>
    <div class="stat-card"><span class="stat-val" id="cashRunning">$0</span><span class="stat-label">Daily Sales</span></div>
</div>

<div style="margin-bottom:20px;">
    <h3 style="color:var(--gold); border-bottom: 1px solid #333;">TODAY'S ORDERS</h3>
    <table id="ledger">
        <thead><tr><th>Client</th><th>Order</th><th>Status</th></tr></thead>
        <tbody id="ledgerBody"></tbody>
    </table>
</div>

<div class="nav-bar">
    <button class="btn btn-gold" onclick="openSaleModal()">+ NEW ORDER</button>
    <button class="btn" style="background:#222; color:var(--gold);" onclick="openModal('customerModal')">👥 CLIENTS</button>
    <button class="btn" style="background:#300; color:#fff;" onclick="openModal('batchModal')">🍲 BATCH</button>
</div>

<!-- CLIENT ROLODEX MODAL -->
<div id="customerModal" class="modal"><div class="sheet">
    <h2 style="color:var(--gold); margin:0;">CLIENT ROLODEX</h2>
    <div id="custForm" style="margin-top:15px; border-bottom:1px solid #333; padding-bottom:15px;">
        <input type="hidden" id="custEditId">
        <label>Full Name</label><input id="custName">
        <label>Phone (WhatsApp #)</label><input id="custPhone" type="tel">
        <label>Full Address</label><input id="custAddress">
        <button class="btn btn-gold" style="width:100%; margin-top:10px;" onclick="saveCustomerManual()">SAVE TO ROLODEX</button>
    </div>
    <div style="margin-top:15px; max-height:300px; overflow-y:auto;">
        <table><tbody id="customerListBody"></tbody></table>
    </div>
    <button class="btn" style="width:100%; color:#666; margin-top:10px;" onclick="closeModal('customerModal')">CLOSE</button>
</div></div>

<!-- NEW ORDER MODAL -->
<div id="saleModal" class="modal"><div class="sheet">
    <h2 style="color:var(--gold); margin:0;">NEW ORDER</h2>
    <input type="hidden" id="editSId">
    
    <label>Date</label><input id="sDate" type="date">
    
    <label>Phone / Account #</label>
    <input id="sPhone" list="phoneOptions" oninput="autoFillByPhone(); updateReceipt()">
    <datalist id="phoneOptions"></datalist>

    <label>Client Name</label>
    <input id="sClient" list="nameOptions" oninput="autoFillByName(); updateReceipt()">
    <datalist id="nameOptions"></datalist>

    <label>Address</label>
    <input id="sAddress" oninput="updateReceipt()">

    <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
    
    <label>Product</label>
    <select id="sProd" onchange="updateReceipt()">
        <option value="CHICKEN">CHICKEN (MAIN)</option>
        <option value="GIZZARDS">GIZZARDS</option>
        <option value="FEET">FEET</option>
    </select>
    
    <div style="display:flex; gap:10px;">
      <div style="flex:1;"><label>Kilos</label><input id="sKilos" type="number" step="0.1" oninput="updateReceipt()"></div>
      <div style="flex:1;"><label>Price/Kg</label><input id="sPrice" type="number" oninput="updateReceipt()"></div>
      <div style="flex:1;"><label>Delivery</label><input id="sDelivery" type="number" oninput="updateReceipt()"></div>
    </div>
    
    <div id="receiptPreview" class="receipt-preview"><div id="receiptContent"></div><div id="grandTotalLabel" style="text-align:center; font-weight:bold; color:#000; border-top:1px dashed #ccc; margin-top:5px; padding-top:5px;">TOTAL: $0</div></div>
    
    <button class="btn btn-wa-action" onclick="sendWhatsApp()">📱 SEND WHATSAPP</button>
    <button class="btn btn-gold" style="width:100%; margin-top:15px;" onclick="saveSale()">SAVE ORDER</button>
    <button class="btn" style="width:100%; color:#666;" onclick="closeModal('saleModal')">CANCEL</button>
</div></div>

<!-- BATCH MODAL -->
<div id="batchModal" class="modal"><div class="sheet">
    <h2 style="color:var(--gold);">NEW COOK BATCH</h2>
    <label>Product</label><select id="bProd"><option value="CHICKEN">CHICKEN</option></select>
    <label>Kilos Prepared</label><input id="bKilos" type="number" step="0.1">
    <button class="btn btn-gold" style="width:100%; margin-top:20px;" onclick="addBatch()">ADD TO STOCK</button>
    <button class="btn" style="width:100%; color:#666;" onclick="closeModal('batchModal')">CANCEL</button>
</div></div>

<script>
let bizData = JSON.parse(localStorage.getItem("perreria_v10") || '{"transactions":[], "customers":[], "batchHistory":[]}');

function save() { localStorage.setItem("perreria_v10", JSON.stringify(bizData)); render(); }

// --- ROLODEX LOGIC ---

function autoFillByPhone() {
    const val = document.getElementById('sPhone').value;
    const match = bizData.customers.find(c => c.phone === val);
    if(match) {
        document.getElementById('sClient').value = match.name;
        document.getElementById('sAddress').value = match.address;
    }
}

function autoFillByName() {
    const val = document.getElementById('sClient').value;
    const match = bizData.customers.find(c => c.name.toLowerCase() === val.toLowerCase());
    if(match) {
        document.getElementById('sPhone').value = match.phone;
        document.getElementById('sAddress').value = match.address;
    }
}

function captureCustomer(name, phone, addr) {
    if(!phone || phone.trim() === "" || name === "CARRY OVER") return;
    const idx = bizData.customers.findIndex(c => c.phone === phone);
    if(idx > -1) {
        bizData.customers[idx].name = name;
        bizData.customers[idx].address = addr;
    } else {
        bizData.customers.push({ id: Date.now(), name, phone, address: addr });
    }
}

function editCustomer(id) {
    const c = bizData.customers.find(x => x.id === id);
    if(c) {
        document.getElementById('custEditId').value = c.id;
        document.getElementById('custName').value = c.name;
        document.getElementById('custPhone').value = c.phone;
        document.getElementById('custAddress').value = c.address;
    }
}

function deleteCustomer(id) {
    if(confirm("Delete this client?")) {
        bizData.customers = bizData.customers.filter(c => c.id !== id);
        save();
    }
}

function saveCustomerManual() {
    const id = document.getElementById('custEditId').value;
    const n = document.getElementById('custName').value;
    const p = document.getElementById('custPhone').value;
    const a = document.getElementById('custAddress').value;
    if(!p) return alert("Phone is required");
    
    if(id) {
        const idx = bizData.customers.findIndex(c => c.id == id);
        bizData.customers[idx] = { id: parseInt(id), name: n, phone: p, address: a };
    } else {
        bizData.customers.push({ id: Date.now(), name: n, phone: p, address: a });
    }
    ['custEditId','custName','custPhone','custAddress'].forEach(k => document.getElementById(k).value="");
    save();
}

// --- ORDER LOGIC ---

function openSaleModal() {
    document.getElementById('editSId').value = "";
    document.getElementById('sDate').value = new Date().toISOString().split('T')[0];
    openModal('saleModal');
}

function saveSale() {
    const id = document.getElementById('editSId').value;
    const n = document.getElementById('sClient').value, p = document.getElementById('sPhone').value, a = document.getElementById('sAddress').value;
    const k = parseFloat(document.getElementById('sKilos').value) || 0, pr = parseFloat(document.getElementById('sPrice').value) || 0, d = parseFloat(document.getElementById('sDelivery').value) || 0;
    
    const data = { 
        id: id ? parseInt(id) : Date.now(), date: document.getElementById('sDate').value, type: 'SALE',
        client: n, phone: p, address: a, product: document.getElementById('sProd').value,
        kilos: k, pricePerKg: pr, delFee: d, total: (k*pr)+d, status: 'PENDING'
    };

    if(id) {
        const idx = bizData.transactions.findIndex(x => x.id == id);
        data.status = bizData.transactions[idx].status;
        bizData.transactions[idx] = data;
    } else {
        bizData.transactions.push(data);
    }
    
    captureCustomer(n, p, a);
    save();
    closeModal('saleModal');
}

function toggleStatus(id) {
    const idx = bizData.transactions.findIndex(x => x.id == id);
    bizData.transactions[idx].status = bizData.transactions[idx].status === 'PENDING' ? 'PAID' : 'PENDING';
    save();
}

function deleteSale(id) { if(confirm("Delete order?")) { bizData.transactions = bizData.transactions.filter(x => x.id != id); save(); } }

function addBatch() {
    const k = parseFloat(document.getElementById('bKilos').value) || 0;
    bizData.batchHistory.push({ id: Date.now(), product: 'CHICKEN', kilos: k, date: new Date().toISOString() });
    document.getElementById('bKilos').value = "";
    save();
    closeModal('batchModal');
}

// --- UTILS ---

function updateReceipt() {
    const n = document.getElementById('sClient').value || "Guest";
    const a = document.getElementById('sAddress').value || "No address";
    const k = document.getElementById('sKilos').value || 0;
    const p = document.getElementById('sPrice').value || 0;
    const d = parseFloat(document.getElementById('sDelivery').value) || 0;
    const total = (k * p) + d;
    
    document.getElementById('receiptContent').innerText = `LA PERRERÍA GOURMET PV\n----------------------\nCLIENT: ${n}\nADDR: ${a}\nITEM: ${k}kg Chicken\nDELIVERY: $${d}`;
    document.getElementById('grandTotalLabel').innerText = `TOTAL: $${total}`;
}

function sendWhatsApp() {
    const p = document.getElementById('sPhone').value;
    const msg = encodeURIComponent(document.getElementById('receiptContent').innerText + `\nTOTAL: $${document.getElementById('grandTotalLabel').innerText.split('$')[1]}`);
    if(!p) return alert("Enter phone first");
    window.open(`https://wa.me/52${p}?text=${msg}`);
}

function render() {
    const today = new Date().toISOString().split('T')[0];
    const txToday = bizData.transactions.filter(x => x.date === today);
    
    let dailyTotal = 0, soldKilos = 0;
    txToday.forEach(t => { dailyTotal += t.total; soldKilos += t.kilos; });
    
    const totalBatch = bizData.batchHistory.reduce((sum, b) => sum + b.kilos, 0);
    const totalSoldEver = bizData.transactions.reduce((sum, t) => sum + t.kilos, 0);
    
    document.getElementById('stockMain').innerText = (totalBatch - totalSoldEver).toFixed(1) + " kg";
    document.getElementById('cashRunning').innerText = "$" + dailyTotal.toLocaleString();

    document.getElementById('ledgerBody').innerHTML = txToday.map(t => `
        <tr>
            <td><strong>${t.client}</strong><br><small>${t.phone}</small></td>
            <td>${t.kilos}kg @ $${t.pricePerKg}<br><small>$${t.total}</small></td>
            <td>
                <span class="status-${t.status.toLowerCase()}" onclick="toggleStatus(${t.id})">${t.status}</span><br>
                <button class="btn-sm" style="background:transparent; color:#555;" onclick="deleteSale(${t.id})">🗑️</button>
            </td>
        </tr>
    `).join("");

    document.getElementById('customerListBody').innerHTML = bizData.customers.sort((a,b) => a.name.localeCompare(b.name)).map(c => `
        <tr>
            <td style="color:var(--gold); font-weight:bold;">${c.name}<br><small style="color:#777">${c.phone}</small></td>
            <td class="btn-grp">
                <button class="btn-sm" style="background:#222; color:var(--gold);" onclick="editCustomer(${c.id})">EDIT</button>
                <button class="btn-sm" style="background:#300; color:#fff;" onclick="deleteCustomer(${c.id})">DEL</button>
            </td>
        </tr>
    `).join("");

    document.getElementById('phoneOptions').innerHTML = bizData.customers.map(c => `<option value="${c.phone}">${c.name}</option>`).join("");
    document.getElementById('nameOptions').innerHTML = bizData.customers.map(c => `<option value="${c.name}">`).join("");
}

function openModal(id) { document.getElementById(id).style.display = 'block'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

window.onload = render;
</script>
</body>
</html>
